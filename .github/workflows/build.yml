name: Go

on:
  push:
    # branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.19

    - name: Generage
      run: go run ./...

    - name: Push new index.json
      uses: mikeal/publish-to-github-action@master
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: 'miru_alpha'

  # The plug bench compiles the Go extensions against the V2 runtime, which is
  # vendored as the miru-core submodule. It runs the extensions for real
  # (they hit the network), so it is kept off the publish path.
  bench:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Build the extensions against the pinned V2 runtime
      run: |
        # The bench compiles ONE extension at a time (the harness expects a
        # single plug file), so each published extension is copied in and
        # type-checked against the submodule's runtime. This is what catches
        # an extension using an SDK that upstream has since removed.
        for ext in repo/golang/*.go; do
          [ -e "$ext" ] || continue
          rm -f plug/*.go
          cp "$ext" plug/
          (cd plug && go build ./...)
        done
